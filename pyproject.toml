[project]
name = "pcosense"
version = "0.1.0"
description = "Explainable ML for PCOS pattern/risk assessment (research prototype, not a diagnostic tool)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
