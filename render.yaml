services:
  - type: web
    name: pcosense-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt && pip install -e . --no-deps
    startCommand: uvicorn pcosense.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_URLS
        sync: false